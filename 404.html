<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fithub Point</title>
  <meta name="description" content="Bu bağlantı Fithub Point uygulamasında açılır. Uygulama yüklü değilse Google Play'den indir." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0C0C0E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0C0C0E; --card:#141416; --text:#F5F7F7; --soft:#A8B4B7; --teal:#3E9E8E; --line:rgba(255,255,255,.1); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(60% 40% at 50% 0%, rgba(62,158,142,.22), transparent 70%), var(--bg); color:var(--text); font-family:"DM Sans", system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:36px 28px; text-align:center; }
    .logo { width:72px; height:72px; margin:0 auto 20px; display:block; }
    .eyebrow { font-family:"DM Mono", monospace; font-size:12px; letter-spacing:.24em; color:var(--teal); text-transform:uppercase; }
    h1 { font-family:"Bebas Neue", Impact, sans-serif; font-weight:400; font-size:44px; line-height:1; margin:12px 0 10px; letter-spacing:.01em; }
    p { color:var(--soft); font-size:15px; line-height:1.55; margin:0 0 22px; }
    .code { display:inline-block; margin:0 0 22px; padding:10px 18px; border:1px dashed rgba(62,158,142,.6); border-radius:12px; font-family:"DM Mono", monospace; font-size:22px; letter-spacing:.18em; color:var(--text); }
    .btn { display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:15px 18px; border-radius:14px; text-decoration:none; font-weight:600; font-size:16px; margin-bottom:12px; border:1px solid var(--line); color:var(--text); background:linear-gradient(180deg,#1a2023,#0c1012); }
    .btn--primary { background:linear-gradient(135deg,#5DC4B0,#3E9E8E); color:#06100E; border-color:transparent; }
    .btn--soon { opacity:.55; border-style:dashed; cursor:default; }
    .btn svg { width:22px; height:22px; flex-shrink:0; }
    .btn small { display:block; font-size:11px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; opacity:.75; }
    .btn div { text-align:left; line-height:1.15; }
    .back { display:inline-block; margin-top:8px; color:var(--soft); font-size:14px; text-decoration:none; }
    .back:hover { color:var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/logo.png" alt="Fithub Point" />
    <div class="eyebrow">Fithub Point</div>
    <h1 id="title">Uygulamada aç</h1>
    <p id="lead">Bu bağlantı Fithub Point uygulamasında açılır. Uygulama yüklüyse otomatik açılmalı; değilse aşağıdan indir.</p>
    <div id="codeBox" class="code" hidden></div>
    <a id="openApp" class="btn btn--primary" href="#" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <div><small>Yüklüyse</small>Uygulamayı aç</div>
    </a>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.fithubpoint.app" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 20.5V3.5c0-.59.34-1.11.84-1.35L13.69 12 3.84 21.85c-.5-.25-.84-.76-.84-1.35M16.81 15.12 6.05 21.34l8.49-8.49 2.27 2.27M20.16 10.81c.39.31.66.78.66 1.31 0 .53-.25.99-.64 1.3l-2.21 1.27-2.6-2.59 2.6-2.59 2.19 1.3M6.05 2.66l10.76 6.22-2.27 2.27L6.05 2.66"/></svg>
      <div><small>İndir</small>Google Play</div>
    </a>
    <span class="btn btn--soon" title="App Store sürümü yakında">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      <div><small>Yakında</small>App Store</div>
    </span>
    <a class="back" href="/">fithubpoint.com'a dön</a>
  </main>
  <script>
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      var parts = path.split("/").filter(Boolean); // ["app", ...]
      if (parts[0] !== "app") {
        document.getElementById("title").textContent = "Sayfa bulunamadı";
        document.getElementById("lead").textContent = "Aradığın sayfa taşınmış ya da hiç var olmamış olabilir.";
        document.querySelectorAll(".btn").forEach(function (b) { b.remove(); });
        return;
      }
      var title = document.getElementById("title");
      var lead = document.getElementById("lead");
      var codeBox = document.getElementById("codeBox");
      if (parts[1] === "coach" && parts[2]) {
        var code = decodeURIComponent(parts[2]).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 20);
        if (code) {
          title.textContent = "Koç davet kodun hazır";
          lead.textContent = "Uygulamayı indir, kayıt olduktan sonra bu kodu koç seçim adımında gir.";
          codeBox.textContent = code;
          codeBox.hidden = false;
        }
      } else if (parts[1] === "workout") {
        title.textContent = "Bugünkü antrenman";
        lead.textContent = "Antrenman programını görmek için uygulamayı aç. Yüklü değilse Google Play'den indir.";
      } else if (parts[1] === "badges") {
        title.textContent = "Rozetlerin";
        lead.textContent = "Kazandığın rozetleri görmek için uygulamayı aç.";
      }
      // Android: bağlantı tarayıcıda açıldıysa uygulamayı intent ile dene (yüklü değilse Play'e düşer)
      if (/android/i.test(navigator.userAgent)) {
        var open = document.getElementById("openApp");
        var target = location.pathname + location.search;
        open.href = "intent://fithubpoint.com" + target + "#Intent;scheme=https;package=com.fithubpoint.app;S.browser_fallback_url=" +
          encodeURIComponent("https://play.google.com/store/apps/details?id=com.fithubpoint.app") + ";end";
        open.hidden = false;
      }
    })();
  </script>
</body>
</html>
